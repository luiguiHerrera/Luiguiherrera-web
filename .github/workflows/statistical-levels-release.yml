# Identity-critical bootstrap. No release target is selected until an explicit fixed operation passes all gates.
name: Statistical Levels controlled release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [vercel-deployment]
  workflow_dispatch:
    inputs:
      operation:
        description: Adopt the already-published baseline, or qualify an explicitly selected future data candidate
        required: true
        type: choice
        default: ADOPT_EXISTING_PRODUCTION_BASELINE
        options:
          - ADOPT_EXISTING_PRODUCTION_BASELINE
          - PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE
          - PROBE_IDENTITY
          - EXTRAORDINARY_EDITORIAL_AUTHORITY_TRANSITION
      candidate_git_sha:
        description: Future qualified data candidate SHA; leave empty for baseline adoption
        type: string
        default: ''
      candidate_deployment_id:
        description: Exact future Preview deployment ID; leave empty for baseline adoption
        type: string
        default: ''
      expected_previous_production_sha:
        description: Expected certified Production SHA; leave empty for baseline adoption
        type: string
        default: ''
      expected_previous_production_deployment:
        description: Expected certified Production deployment; leave empty for baseline adoption
        type: string
        default: ''
      previous_publication_date:
        description: Certified previous daily marker date UTC; leave empty for baseline adoption
        type: string
        default: ''
      resume_production_deployment_id:
        description: Existing Production deployment to observe and certify only; never create another build
        type: string
        default: ''
      probe_git_sha:
        description: Immutable Preview fixture SHA for PROBE_IDENTITY only
        type: string
        default: ''
      probe_deployment_id:
        description: Exact Preview deployment ID for PROBE_IDENTITY only
        type: string
        default: ''
      transition_request:
        description: Extraordinary operation only; JSON with direction, phase, authorization_sha256 and expected_head_sha256. No target or authority values.
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: statistical-levels-controlled-release
  cancel-in-progress: false
jobs:
  candidate-qa:
    name: Statistical Levels candidate QA
    if: (inputs.operation == 'ADOPT_EXISTING_PRODUCTION_BASELINE' || inputs.operation == 'PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE') && github.repository == 'luiguiHerrera/Luiguiherrera-web' && github.ref == 'refs/heads/vercel-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      qa_envelope: ${{ steps.qa.outputs.qa_envelope }}
      qa_payload_sha256: ${{ steps.qa.outputs.qa_payload_sha256 }}
    steps:
      - name: Check out execution source B
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Independently verify execution identity and selected target ancestry
        id: identity
        run: node scripts/statistical-levels-release/scripts/cli.mjs preflight
      - name: Check out verified Production baseline or explicitly selected future candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.identity.outputs.candidate_sha }}
          path: .release-candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked QA dependencies without lifecycle scripts
        run: |
          npm ci --prefix .release-candidate --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          npm ci --prefix scripts/statistical-levels-release/qa-dependencies --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          node scripts/statistical-levels-release/qa-dependencies/node_modules/playwright/cli.js install --with-deps chromium
      - name: Public Production or exact Preview QA with canonical non-secret attestation outputs
        id: qa
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs qa
      - name: Retain sanitized candidate QA failure diagnostics
        if: failure() && steps.qa.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-candidate-qa-failure-diagnostics
          path: |
            ${{ runner.temp }}/statistical-levels-candidate-qa/native-ingress.jsonl
            ${{ runner.temp }}/statistical-levels-candidate-qa/native-lifecycle-diagnostics.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/adopt-request-evidence.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/network-accounting.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/browser-report.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/defect-browser-report.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/interaction-browser-report.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          overwrite: false
      - name: Retain sanitized ADOPT request lifecycle evidence
        if: always() && inputs.operation == 'ADOPT_EXISTING_PRODUCTION_BASELINE' && steps.qa.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-adopt-request-evidence
          path: |
            ${{ runner.temp }}/statistical-levels-candidate-qa/qa-attestation.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/product-report.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/adopt-request-evidence.json
            ${{ runner.temp }}/statistical-levels-candidate-qa/native-ingress.jsonl
            ${{ runner.temp }}/statistical-levels-candidate-qa/native-lifecycle-diagnostics.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
  seal-qa:
    name: statistical-levels-candidate-qa-sha256-${{ needs.candidate-qa.outputs.qa_payload_sha256 }}
    needs: candidate-qa
    if: needs.candidate-qa.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Complete the public server-owned digest marker
        env:
          QA_SHA256: ${{ needs.candidate-qa.outputs.qa_payload_sha256 }}
        shell: bash
        run: |
          [[ "$QA_SHA256" =~ ^[a-f0-9]{64}$ ]]
  invoke-controller:
    outputs:
      production_stage: ${{ steps.controller.outputs.production_stage }}
    name: Statistical Levels release controller
    needs: [candidate-qa, seal-qa]
    if: (inputs.operation == 'ADOPT_EXISTING_PRODUCTION_BASELINE' || inputs.operation == 'PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE') && needs.candidate-qa.result == 'success' && needs.seal-qa.result == 'success' && github.repository == 'luiguiHerrera/Luiguiherrera-web' && github.ref == 'refs/heads/vercel-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Verify public completed QA jobs, ancestry and default AWS OIDC identity
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          SL_QA_ENVELOPE: ${{ needs.candidate-qa.outputs.qa_envelope }}
          SL_QA_PAYLOAD_SHA256: ${{ needs.candidate-qa.outputs.qa_payload_sha256 }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs prepare-invocation
      - name: Assume only dedicated Lambda invoker
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::732159826922:role/LuiguiHerreraStatisticalLevelsReleaseInvoker
          audience: sts.amazonaws.com
          allowed-account-ids: '732159826922'
          role-session-name: sl-release-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          disable-retry: true
          action-timeout-s: 60
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:eu-south-2:732159826922:function:statistical-levels-vercel-release-controller"}]}'
      - name: Invoke the exact controller once; no direct promotion or automatic retry
        id: controller
        env:
          SL_RELEASE_STAGE: start
        run: node scripts/statistical-levels-release/scripts/invoke.mjs
      - name: Retain bounded controller failure diagnostics; never a G5 receipt
        if: failure() && steps.controller.outcome == 'failure' && steps.controller.outputs.controller_failure_diagnostic_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-controller-failure
          path: ${{ runner.temp }}/statistical-levels-controller-failure.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
      - name: Retain sanitized successful ADOPT invocation receipt for independent G6
        if: success() && inputs.operation == 'ADOPT_EXISTING_PRODUCTION_BASELINE'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-g5-invocation-receipt
          path: ${{ runner.temp }}/statistical-levels-g5-invocation-receipt.json
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
  production-qa:
    name: Statistical Levels exact Production QA
    needs: [candidate-qa, invoke-controller]
    if: inputs.operation == 'PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE' && needs.invoke-controller.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      checks: write
    outputs:
      production_stage: ${{ steps.observe.outputs.production_stage }}
      production_envelope: ${{ steps.production.outputs.production_envelope }}
      production_check_id: ${{ steps.production.outputs.production_check_id }}
      production_payload_sha256: ${{ steps.production.outputs.production_payload_sha256 }}
    steps:
      - name: Check out execution source B
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Independently verify execution identity and selected target ancestry
        id: identity
        run: node scripts/statistical-levels-release/scripts/cli.mjs preflight
      - name: Check out verified Production baseline or explicitly selected future candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.identity.outputs.candidate_sha }}
          path: .release-candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked QA dependencies without lifecycle scripts
        run: |
          npm ci --prefix .release-candidate --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          npm ci --prefix scripts/statistical-levels-release/qa-dependencies --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          node scripts/statistical-levels-release/qa-dependencies/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare exact read-only continuation request
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          SL_QA_ENVELOPE: ${{ needs.candidate-qa.outputs.qa_envelope }}
          SL_QA_PAYLOAD_SHA256: ${{ needs.candidate-qa.outputs.qa_payload_sha256 }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs prepare-invocation
      - name: Assume only dedicated Lambda invoker
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::732159826922:role/LuiguiHerreraStatisticalLevelsReleaseInvoker
          audience: sts.amazonaws.com
          allowed-account-ids: '732159826922'
          role-session-name: sl-release-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          disable-retry: true
          action-timeout-s: 60
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:eu-south-2:732159826922:function:statistical-levels-vercel-release-controller"}]}'
      - name: Observe only the registered Production build; never rebuild
        id: observe
        env:
          SL_RELEASE_STAGE: observe
          SL_PRODUCTION_STAGE: ${{ needs.invoke-controller.outputs.production_stage }}
        run: node scripts/statistical-levels-release/scripts/invoke.mjs
      - name: Run public Production QA and seal its real Check
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          SL_PRODUCTION_STAGE: ${{ steps.observe.outputs.production_stage }}
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          SL_QA_ENVELOPE: ${{ needs.candidate-qa.outputs.qa_envelope }}
          SL_QA_PAYLOAD_SHA256: ${{ needs.candidate-qa.outputs.qa_payload_sha256 }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs production-qa
      - name: Retain exact Production QA evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-production-qa
          path: |
            ${{ runner.temp }}/statistical-levels-production-qa/*.json
            ${{ runner.temp }}/statistical-levels-production-qa/*.jsonl
            ${{ runner.temp }}/statistical-levels-controller-response.json
          retention-days: 90
          if-no-files-found: warn
          overwrite: false
  seal-production-qa:
    name: statistical-levels-production-qa-sha256-${{ needs.production-qa.outputs.production_payload_sha256 }}
    needs: production-qa
    if: inputs.operation == 'PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE' && needs.production-qa.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Bind actual successful Production QA to its digest
        env:
          HASH: ${{ needs.production-qa.outputs.production_payload_sha256 }}
        run: '[[ "$HASH" =~ ^[a-f0-9]{64}$ ]]'
  certify-production:
    name: Statistical Levels publication certification
    needs: [candidate-qa, production-qa, seal-production-qa]
    if: inputs.operation == 'PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE' && needs.production-qa.result == 'success' && needs.seal-production-qa.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      checks: write
    outputs:
      publication_state: ${{ steps.certify.outputs.publication_state }}
      marker_sha256: ${{ steps.certify.outputs.marker_sha256 }}
    steps:
      - name: Check out execution source B
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Bind completed Production Check to the original promotion
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          SL_QA_ENVELOPE: ${{ needs.candidate-qa.outputs.qa_envelope }}
          SL_QA_PAYLOAD_SHA256: ${{ needs.candidate-qa.outputs.qa_payload_sha256 }}
          SL_PRODUCTION_STAGE: ${{ needs.production-qa.outputs.production_stage }}
          SL_PRODUCTION_ENVELOPE: ${{ needs.production-qa.outputs.production_envelope }}
          SL_PRODUCTION_CHECK_ID: ${{ needs.production-qa.outputs.production_check_id }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs prepare-certification
      - name: Assume only dedicated Lambda invoker
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::732159826922:role/LuiguiHerreraStatisticalLevelsReleaseInvoker
          audience: sts.amazonaws.com
          allowed-account-ids: '732159826922'
          role-session-name: sl-release-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          disable-retry: true
          action-timeout-s: 60
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:eu-south-2:732159826922:function:statistical-levels-vercel-release-controller"}]}'
      - name: Certify existing Production once; no new promotion
        id: certify
        env:
          SL_RELEASE_STAGE: certify
        run: node scripts/statistical-levels-release/scripts/invoke.mjs
      - name: Publish exact PUBLISHED receipt Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs seal-publication
      - name: Retain publication or failure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-published-receipt
          path: |
            ${{ runner.temp }}/statistical-levels-published-receipt.json
            ${{ runner.temp }}/statistical-levels-controller-response.json
            ${{ runner.temp }}/statistical-levels-controller-failure.json
          retention-days: 90
          if-no-files-found: warn
          overwrite: false
  publication-result:
    name: statistical-levels-published-sha256-${{ needs.certify-production.outputs.marker_sha256 }}
    needs: [invoke-controller, production-qa, certify-production]
    if: always() && inputs.operation == 'PROMOTE_EXACT_STATISTICAL_LEVELS_CANDIDATE'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse every incomplete or uncertified publication
        env:
          INVOCATION: ${{ needs.invoke-controller.result }}
          PRODUCTION_QA: ${{ needs.production-qa.result }}
          CERTIFICATION: ${{ needs.certify-production.result }}
          STATE: ${{ needs.certify-production.outputs.publication_state }}
        run: |
          [[ "$INVOCATION" == success && "$PRODUCTION_QA" == success && "$CERTIFICATION" == success && "$STATE" == PUBLISHED ]]
  daily-dispatch:
    name: Disabled until Founder activation after first PUBLISHED
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.workflow_id == 336203586 && vars.SL_DAILY_PUBLICATION == 'APPROVED_AFTER_FIRST_PUBLISHED' && vars.SL_FIRST_PUBLISHED_CHECK_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out execution source B
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Dispatch one exact certified daily candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SL_DAILY_PUBLICATION: ${{ vars.SL_DAILY_PUBLICATION }}
          SL_FIRST_PUBLISHED_CHECK_ID: ${{ vars.SL_FIRST_PUBLISHED_CHECK_ID }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs daily-dispatch
  identity-probe:
    name: Statistical Levels non-release identity probe
    if: inputs.operation == 'PROBE_IDENTITY' && github.repository == 'luiguiHerrera/Luiguiherrera-web' && github.ref == 'refs/heads/vercel-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out probe execution source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen probe helper bytes
        id: source_integrity
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Verify execution identity and resolve the exact public Preview tuple
        id: resolve
        run: node scripts/statistical-levels-release/scripts/probe-cli.mjs preflight
      - name: Check out verified immutable Preview fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.resolve.outputs.candidate_sha }}
          path: .identity-probe-candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked QA dependencies without lifecycle scripts
        run: |
          npm ci --prefix .identity-probe-candidate --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          npm ci --prefix scripts/statistical-levels-release/qa-dependencies --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          node scripts/statistical-levels-release/qa-dependencies/node_modules/playwright/cli.js install --with-deps chromium
      - name: Protected Preview QA through exact-origin Trusted Sources OIDC
        id: qa
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: node scripts/statistical-levels-release/scripts/probe-cli.mjs qa
      - name: Validate QA attestation and audience-specific AWS OIDC claims
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: node scripts/statistical-levels-release/scripts/probe-cli.mjs aws-preflight
      - name: Assume only dedicated release invoker with all non-identity actions denied
        id: aws_assume
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::732159826922:role/LuiguiHerreraStatisticalLevelsReleaseInvoker
          audience: sts.amazonaws.com
          allowed-account-ids: '732159826922'
          role-session-name: sl-probe-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          mask-aws-account-id: true
          disable-retry: true
          action-timeout-s: 60
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","NotAction":"sts:GetCallerIdentity","Resource":"*"}]}'
      - name: Prove exact assumed role through STS identity only
        id: aws_identity
        run: node scripts/statistical-levels-release/scripts/probe-cli.mjs aws-identity
      - name: Reverify helper bytes and finalize sanitized non-secret probe evidence
        id: evidence
        if: always() && steps.source_integrity.outcome == 'success'
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
          PROBE_RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          PROBE_QA_OUTCOME: ${{ steps.qa.outcome }}
          PROBE_AWS_ASSUME_OUTCOME: ${{ steps.aws_assume.outcome }}
          PROBE_AWS_IDENTITY_OUTCOME: ${{ steps.aws_identity.outcome }}
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
          node scripts/probe-cli.mjs evidence
      - name: Retain only the ten sanitized identity-probe evidence files
        if: always() && steps.source_integrity.outcome == 'success' && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-identity-probe-evidence
          path: |
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/probe-summary.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/trusted-sources-qa.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/application-network-summary.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/aws-oidc-summary.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/qa-attestation.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/first-product-failure.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/product-qa-event-timeline.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/product-qa-phase-summary.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/metadata-resolution.json
            ${{ runner.temp }}/statistical-levels-identity-probe/artifact/evidence-sha256.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

  transition-prepare:
    name: Statistical Levels extraordinary preparation
    if: inputs.operation == 'EXTRAORDINARY_EDITORIAL_AUTHORITY_TRANSITION' && github.event_name == 'workflow_dispatch' && github.repository == 'luiguiHerrera/Luiguiherrera-web' && github.ref == 'refs/heads/vercel-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      direction: ${{ steps.request.outputs.direction }}
      requested_phase: ${{ steps.request.outputs.requested_phase }}
      transition_context: ${{ steps.controller.outputs.transition_context }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Validate exact workflow and bounded transition selection
        id: request
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs transition-prepare
      - name: Assume only dedicated Lambda invoker
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::732159826922:role/LuiguiHerreraStatisticalLevelsReleaseInvoker
          audience: sts.amazonaws.com
          allowed-account-ids: '732159826922'
          role-session-name: sl-release-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          disable-retry: true
          action-timeout-s: 60
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:eu-south-2:732159826922:function:statistical-levels-vercel-release-controller"}]}'
      - name: Prepare or resume only the same immutable intent
        id: controller
        env:
          SL_RELEASE_STAGE: transition-prepare
        run: node scripts/statistical-levels-release/scripts/invoke.mjs
      - name: Retain preparation evidence without claiming certification
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-transition-preparation
          path: ${{ runner.temp }}/statistical-levels-transition-invocation.json
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
  transition-qa:
    name: Statistical Levels extraordinary ${{ needs.transition-prepare.outputs.direction }} QA
    needs: transition-prepare
    if: needs.transition-prepare.result == 'success' && needs.transition-prepare.outputs.requested_phase == 'certify'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    outputs:
      transition_envelope: ${{ steps.qa.outputs.transition_envelope }}
      transition_check_id: ${{ steps.qa.outputs.transition_check_id }}
      transition_seal_sha256: ${{ steps.qa.outputs.transition_seal_sha256 }}
    env:
      SL_TRANSITION_CONTEXT: ${{ needs.transition-prepare.outputs.transition_context }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Derive QA target exclusively from verified controller response
        id: target
        run: node scripts/statistical-levels-release/scripts/cli.mjs transition-target
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.target.outputs.candidate_sha }}
          path: .release-candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked QA dependencies without lifecycle scripts
        run: |
          npm ci --prefix .release-candidate --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          npm ci --prefix scripts/statistical-levels-release/qa-dependencies --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --registry=https://registry.npmjs.org
          node scripts/statistical-levels-release/qa-dependencies/node_modules/playwright/cli.js install --with-deps chromium
      - name: Produce fresh public QA for this exact intent and direction
        id: qa
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs transition-qa
      - name: Retain sanitized transition QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-transition-qa
          path: |
            ${{ runner.temp }}/statistical-levels-transition-qa/qa-envelope.json
            ${{ runner.temp }}/statistical-levels-transition-qa/qa-binding.json
            ${{ runner.temp }}/statistical-levels-transition-qa/product-report.json
            ${{ runner.temp }}/statistical-levels-transition-qa/browser-report.json
            ${{ runner.temp }}/statistical-levels-transition-qa/defect-browser-report.json
            ${{ runner.temp }}/statistical-levels-transition-qa/interaction-browser-report.json
            ${{ runner.temp }}/statistical-levels-transition-qa/native-ingress.jsonl
            ${{ runner.temp }}/statistical-levels-transition-qa/native-lifecycle-diagnostics.json
            ${{ runner.temp }}/statistical-levels-transition-qa/adopt-request-evidence.json
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: false
          overwrite: false
  seal-transition-qa:
    name: statistical-levels-transition-${{ needs.transition-prepare.outputs.direction }}-qa-sha256-${{ needs.transition-qa.outputs.transition_seal_sha256 }}
    needs: [transition-prepare, transition-qa]
    if: needs.transition-qa.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Seal successful independent QA and intent binding
        env:
          HASH: ${{ needs.transition-qa.outputs.transition_seal_sha256 }}
        run: '[[ "$HASH" =~ ^[a-f0-9]{64}$ ]]'
  transition-certify:
    name: Statistical Levels extraordinary certification
    needs: [transition-prepare, transition-qa, seal-transition-qa]
    if: needs.transition-qa.result == 'success' && needs.seal-transition-qa.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify frozen helper bytes before executing any helper
        working-directory: scripts/statistical-levels-release
        env:
          EXPECTED_SOURCE_SUMS: 2fcc0e8e0b2295dfcd7fc733917a39bc9645ba9b23b6839195ab42425bfad090
        run: |
          printf '%s  SOURCE_SHA256SUMS\n' "$EXPECTED_SOURCE_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SOURCE_SHA256SUMS
      - name: Independently fetch and bind the completed Check and digest job
        env:
          SL_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SL_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SL_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SL_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          SL_TRANSITION_CONTEXT: ${{ needs.transition-prepare.outputs.transition_context }}
          SL_TRANSITION_ENVELOPE: ${{ needs.transition-qa.outputs.transition_envelope }}
          SL_TRANSITION_CHECK_ID: ${{ needs.transition-qa.outputs.transition_check_id }}
        run: node scripts/statistical-levels-release/scripts/cli.mjs transition-certify
      - name: Assume only dedicated Lambda invoker
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: eu-south-2
          role-to-assume: arn:aws:iam::732159826922:role/LuiguiHerreraStatisticalLevelsReleaseInvoker
          audience: sts.amazonaws.com
          allowed-account-ids: '732159826922'
          role-session-name: sl-release-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          disable-retry: true
          action-timeout-s: 60
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:eu-south-2:732159826922:function:statistical-levels-vercel-release-controller"}]}'
      - name: Certify the exact transition once; never promote or retry automatically
        env:
          SL_RELEASE_STAGE: transition-certify
        run: node scripts/statistical-levels-release/scripts/invoke.mjs
      - name: Retain distinct authority-transition invocation evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistical-levels-transition-certification
          path: ${{ runner.temp }}/statistical-levels-transition-invocation.json
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
