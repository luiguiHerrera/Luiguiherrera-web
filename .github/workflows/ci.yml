      - name: Produce hosted qualification subject handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'SUBJECTCODE'
          import hashlib,json,os,stat,subprocess
          from pathlib import Path
          out=Path(os.environ['CI_EVIDENCE'])
          git=lambda *args: subprocess.check_output(['git',*args])
          head=git('rev-parse','HEAD').decode().strip()
          assert head==os.environ['CI_EVENT_SHA']==os.environ['GITHUB_SHA'], 'WRONG_SUBJECT_CHECKOUT'
          production_parent='d2f20862adb13946c0fc81567184a5c87e43a091'
          canonical=lambda value:(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n').encode('ascii')
          entries=[x for x in git('ls-tree','-r','-z','HEAD').split(b'\0') if x]
          tracked={x.split(b'\t',1)[1] for x in git('ls-tree','-r','-z',production_parent).split(b'\0') if x}
          records=[]
          for entry in entries:
              meta,path=entry.split(b'\t',1); mode,kind,oid=meta.split()
              assert kind==b'blob' and mode==b'100644', 'HOSTED_SUBJECT_ENTRY_MODE'
              status=os.lstat(path); assert stat.S_ISREG(status.st_mode), 'HOSTED_SUBJECT_FILE_TYPE'
              with open(path,'rb') as handle: data=handle.read()
              records.append({'exists':True,'path_hex':path.hex(),'sha256':hashlib.sha256(data).hexdigest(),'tracked':path in tracked,'worktree_file_type':'REGULAR_FILE','worktree_mode':format(stat.S_IMODE(status.st_mode),'06o')})
          records.sort(key=lambda record:bytes.fromhex(record['path_hex']))
          subject={'mode_encoding':'six-octal-digits-of-lstat-S_IMODE','path_encoding':'hex-of-exact-git-path-bytes','records':records,'schema':'statistical-levels.local-qualification-subject.v2','symlink_hash_rule':'sha256-of-link-text-bytes-without-following-target'}
          handoff={'schema':'statistical-levels.hosted-qualification-subject-handoff.v1','producer':'hosted-ci-subject-producer','checkout':head,'production_parent':production_parent,'subject':subject,'subject_sha256':hashlib.sha256(canonical(subject)).hexdigest()}
          (out/'subject-before.json').write_text(json.dumps(handoff,sort_keys=True)+'\n')
          print(json.dumps({'records':len(records),'tracked':sum(record['tracked'] for record in records),'subject_sha256':handoff['subject_sha256']}))
          SUBJECTCODE

