          subject=json.loads((out/'subject.json').read_text());assert subject['head_sha']==os.environ['CI_EVENT_SHA'], 'WRONG_SUBJECT_SHA'
          assert subject['head_sha']==os.environ['GITHUB_SHA'], 'WRONG_SUMMARY_SHA'
          assert subject['run_id']==os.environ['GITHUB_RUN_ID'] and subject['run_attempt']==os.environ['GITHUB_RUN_ATTEMPT'], 'CROSS_RUN_SUBJECT'
          assert subject['event']==os.environ['GITHUB_EVENT_NAME'] and subject['ref']==os.environ['GITHUB_REF'], 'WRONG_SUBJECT_EVENT'
          assert subject['integration_push']==(os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/vercel-deployment'), 'WRONG_INTEGRATION_CLASS'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==subject['head_sha']
          summary['subject']=subject
          summary['integration_qualification_complete']=subject['integration_push']
          summary['covered_obligations']=['C%02d'%i for i in range(1,14) if i!=11 or subject['integration_push']]
          summary['lineage_tests_executed']=True
          summary['governed_metadata_repair_parent_verified']=subject['lineage']['metadata_repair_parent_verified']
          summary['governed_registration_successor_parent_verified']=subject['lineage']['registration_successor_parent_verified']
          summary['governed_registration_content_verified']=subject['lineage']['registration_content_verified']
          summary['governed_two_parent_anchor_verified']=subject['lineage']['two_parent_anchor_verified']
          summary['candidate_content_sha256']=hashlib.sha256(json.dumps(after,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'qualification-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
