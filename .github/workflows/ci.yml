              expected_current=report_ledger[entry['path']]['sha256'] if entry['path']=='public/reports/manifest.json' else entry['sha256']
              assert sha((root/entry['path']).read_bytes())==expected_current, entry['path']
          assert {e['path']for e in preservation['historical_files']} & set(report_ledger)=={'public/reports/manifest.json'}
          active=unique(root/'lib/statistical-levels/generated-provenance.json')
          assert active['SCHEMA_VERSION']=='statistical-levels.provenance.v1' and active['SOURCE_STATE']=='COMMITTED'
          compact=lambda x:json.dumps(x,separators=(',',':'),ensure_ascii=False).encode()
          assert sha(compact(active['SOURCE_BUNDLE']))==active['GENERATOR_SHA256']
          assert sha(compact(active['CONFIG']))==active['CONFIG_SHA256']
          assert active['BASELINE_ID']==active['CONFIG']['BASELINE_ID']
          for item in active['SOURCE_BUNDLE']:
              assert sha((root/item['file']).read_bytes())==item['SHA256']
          snapshots=active['snapshots']
          assert len(snapshots)==len({x['FILE'] for x in snapshots})==81
          assert {'lib/statistical-levels/generated/'+e['FILE'] for e in snapshots}=={e['path'] for e in preservation['statistical_files'] if '/generated/' in e['path']}
          for item in snapshots:
              assert sha((root/'lib/statistical-levels/generated'/item['FILE']).read_bytes())==item['SNAPSHOT_SHA256']
              for key in ['GENERATOR_COMMIT','GENERATOR_SHA256','CONFIG_SHA256','GENERATED_AT']: assert item[key]==active[key]
              assert item['INPUTS'] and all(i['RAW_SOURCE_ID'].startswith(active['BASELINE_ID']+'/raw/') and re.fullmatch('[a-f0-9]{64}',i['RAW_SHA256']) and i['SNAPSHOT_CUTOFF']==active['CONFIG']['SNAPSHOT_CUTOFF'] for i in item['INPUTS'])
          print(json.dumps({'source_bundle':'PASS','source_sums':'PASS','workflow_pins':'PASS','freeze':'PASS','policy_hash':'PASS','preservation':'PASS'}))
          PYCODE

