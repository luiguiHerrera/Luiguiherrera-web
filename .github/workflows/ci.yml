name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI_EVENT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Bind qualification to event SHA and governed metadata-repair successor lineage
        shell: bash
        run: |
          set -euo pipefail
          export CI_EVIDENCE="${RUNNER_TEMP:?}/statistical-levels-ci"
          printf 'CI_EVIDENCE=%s\n' "$CI_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$CI_EVIDENCE"
          python3 - <<'PYCODE'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path.cwd(); out=Path(os.environ['CI_EVIDENCE'])
          git=lambda *args: subprocess.check_output(['git',*args])
          head=git('rev-parse','HEAD').decode().strip()
          assert re.fullmatch('[a-f0-9]{40}',os.environ['CI_EVENT_SHA']), 'EVENT_SHA_NOT_IMMUTABLE'
          assert head==os.environ['CI_EVENT_SHA']==os.environ['GITHUB_SHA'], 'WRONG_TESTED_SHA'
          subprocess.run(['git','diff','--exit-code','HEAD','--'],check=True)
          parents=git('show','-s','--format=%P','HEAD').decode().strip().split()
          execution='0c8fce262fce44650729883862ec948778ebea45'
          production='c60b17c6ddc5a08fcd402328f69e73f6e1e41b5f'
          merge_anchor='e7872b9c0e5bb0be3e090fbe2c5b930d68dcbece'
          qualified_predecessor='c8454dc06bae4bfc2d6fbc90cf9ffa4f94bb63c1'
          repair_parent='f7e3fe8e3e3cd8bdea753873c31d78f146cdc923'
          pre_publication_parent='e2f57918a495051c803fb60cd90bcd1c82e6d473'
          current_implementation_parent='13c1771fea1d1bcb6bae41c6ba2fcdb76118f48c'
          g5_parent='d9c8bc0e307a6b2315e6179f5ef19f85dbf67a5e'  # Immutable historical SL source-lineage anchor.
          epoch_anchor='32dc0bd36a6dccd97035f60fc6b43ab266525058'  # Published ordered two-parent integration commit; current epoch source-lineage anchor and generated-advance window base.
          historical_sl_parent='429cab18b6d194290ee710b73b20aaefe653c3e0'  # Authenticated prior-epoch generated-state head; ordered second parent of the epoch anchor.
          historical_sl_predecessor='e80c5a348432613c34d366cce2f1215e11d1ccbf'  # Authenticated prior-epoch published integration commit; exact parent of the historical SL parent and prior epoch source-lineage anchor.
          historical2_sl_parent='07ade9c9621439c29f9c4595c550c354cdd7108e'  # Authenticated second-prior-epoch generated-state head; ordered second parent of the prior epoch anchor.
          historical2_sl_predecessor='000806bd8cb6da25dd0bdd4721f4e4731116e09e'  # Authenticated second-prior-epoch generated-state advance; exact parent of the second-prior historical SL parent.
          intermediate_sl_parent='5d45bbd37bf63f80022b47211a8ee6c0330a3f9b'  # Exact first authenticated generated advance.
          previous_sl_parent='32f38169d83d79d37a790c9555ef6cdeb66ee231'  # Exact second authenticated generated advance and current predecessor.
          third_sl_parent='199e8a2f37656512e62bd9015a216dacab0a67ee'
          fourth_sl_parent='15b010b74a082639357f2b960833c347a8a7d3ad'
          current_sl_parent='1a4d38ecfff37b8a081f5ec8076eb805d515ea09'  # Authenticated generated-state advance and exact current second parent.
          third_sl_parent_tree=None
          fourth_sl_parent_tree=None
          current_sl_parent_tree=None
          intermediate_sl_parent_tree=None
          recent_sl_parent_tree=None
          historical_sl_parent_tree=None
          production_parent='d2f20862adb13946c0fc81567184a5c87e43a091'
          production_parent_tree=None
          g5_prior='26c13fcf4ddb279d3f5454cfbb71b2073820b430'
          g5_previous='9b860095e7f18c26393af1e028244c1bae9c1598'
          publication_predecessor='cb63f82d7e2e7cd9f6283f26d8bdb120da8c174c'
          runtime_repair_parent='acfd5efed5984a7981e64a6953960c161fa11dc7'
          implementation_parent='65aec8374a896bb7323dcd76af7263fb437610fa'
          implementation_parent_predecessor='94e8ef63bea09b1043bad217946736503b147731'
          implementation_predecessor='578498f33b5bf7c70f5c43894d05f67aea409a00'
          data_parent='d290691156b933ba62e5e8f6489dc870568126e0'
          repair_parent_parents=None
          predecessor_parents=None
          anchor_parents=None
          g5_parent_tree=None
          # G5_EXECUTION_PRESERVATION_BEGIN
          def verify_g5_execution(head, parents):
              first='9aea3eb35580f24362edc206fc4454e658226d17'
              production='b1df2f5f1d375e923efc429b6a503c4125a6d522'
              assert parents==[first,production], 'G5_ORDERED_PARENTS'
              assert not os.environ.get('SL_LOCAL_QUALIFICATION_SUBJECT_SHA256'), 'LOCAL_HOSTED_ROLE_CONFLICT'
              def inventory(ref):
                  entries={}
                  for row in git('ls-tree','-rz',ref).split(b'\0'):
                      if not row: continue
                      meta,name=row.split(b'\t',1); mode,kind,oid=meta.decode().split()
                      assert name.decode() not in entries, 'G5_DUPLICATE_PATH'
                      entries[name.decode()]=(mode,kind,oid)
                  return entries
              for ref,expected_tree in [(first,'06ef4cc7a191cf8ad07c07ea5e8627151971e6d1'),(production,'528d871178d996b067b36c70c8188b516fc0829b')]:
                  raw=git('cat-file','commit',ref)
                  assert hashlib.sha1(b'commit '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==ref, 'G5_PARENT_OBJECT'
                  headers=raw.split(b'\n\n',1)[0].decode().splitlines()
                  assert [x[5:]for x in headers if x.startswith('tree ')]==[expected_tree], 'G5_PARENT_TREE'
                  assert git('rev-parse',ref+'^{tree}').decode().strip()==expected_tree, 'G5_PARENT_TREE_READBACK'
                  subprocess.run(['git','merge-base','--is-ancestor',ref,head],check=True)
              before,current=inventory(first),inventory(head)
              assert set(before)<=set(current), 'G5_FIRST_PARENT_REMOVAL'
              allowed={'.github/workflows/ci.yml': 'M', '.github/workflows/statistical-levels-release.yml': 'M', 'scripts/statistical-levels-release/SOURCE_SHA256SUMS': 'M', 'scripts/statistical-levels-release/controller-qa-schema.json': 'M', 'scripts/statistical-levels-release/policy.json': 'M', 'scripts/statistical-levels-release/qa-attestation-schema.json': 'M', 'scripts/statistical-levels-release/scripts/adopt-causal-bridge.mjs': 'M', 'scripts/statistical-levels-release/scripts/adopt-invocation-receipt.mjs': 'A', 'scripts/statistical-levels-release/scripts/browser-harness-base.mjs': 'M', 'scripts/statistical-levels-release/scripts/invoke.mjs': 'M', 'scripts/statistical-levels-release/source-manifest.json': 'M', 'scripts/statistical-levels-release/tests/adopt-causal-bridge.test.mjs': 'M', 'scripts/statistical-levels-release/tests/adopt-invocation-receipt.test.mjs': 'A', 'scripts/statistical-levels-release/tests/adopt-request-evidence.test.mjs': 'M', 'scripts/statistical-levels-release/tests/adopt-validation.test.mjs': 'M', 'scripts/statistical-levels-release/tests/g5-execution-preservation.test.mjs': 'A', 'scripts/statistical-levels-release/tests/preview-qa.test.mjs': 'M', 'scripts/statistical-levels-release/tests/preview-toolbar-integration.test.mjs': 'A', 'scripts/statistical-levels-release/tests/probe-fixture-registry.test.mjs': 'M', 'scripts/statistical-levels-release/tests/probe-product-browser-harness.test.mjs': 'M', 'scripts/statistical-levels-release/tests/probe-qa-http.test.mjs': 'M', 'scripts/statistical-levels-release/tests/probe-redirect-integration.test.mjs': 'M', 'scripts/statistical-levels-release/tests/product-qa-observability-isolation.test.mjs': 'M', 'scripts/statistical-levels-release/workflow-freeze.json': 'M'}
              changed={p:('A' if p not in before else 'M')for p in current if current[p]!=before.get(p)}
              assert changed==allowed, 'G5_EXACT_FIRST_PARENT_DELTA'
              for p in changed:
                  assert current[p][:2]==('100644','blob'), 'G5_DELTA_MODE'
                  assert p not in before or before[p][:2]==('100644','blob'), 'G5_PRIOR_MODE'
              return {'execution_first_parent':first,'production_target':production,'ordered_parents':parents,
                      'preserved_first_parent_files':len(before)-sum(s=='M'for s in changed.values()),
                      'first_parent_files':len(before),'source_files':len(current),'delta':changed,
                      'out_of_scope_removals':0,'out_of_scope_modifications':0}
          # G5_EXECUTION_PRESERVATION_END
          is_integration_push=os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/vercel-deployment'
          if is_integration_push:
              assert not os.environ.get('SL_LOCAL_QUALIFICATION_SUBJECT_SHA256'), 'LOCAL_HOSTED_ROLE_CONFLICT'
              g5_integration=verify_g5_execution(head,parents)
              historical_head=g5_integration['execution_first_parent']
              assert git('show','-s','--format=%P',historical_head).decode().strip().split()==[production_parent,current_sl_parent], 'WRONG_RUNTIME_IMPLEMENTATION_PARENT'
              parent_commit=git('cat-file','commit',production_parent)
              assert hashlib.sha1(b'commit '+str(len(parent_commit)).encode()+b'\0'+parent_commit).hexdigest()==production_parent, 'CAPTURE_PARENT_OBJECT_IDENTITY'
              parent_tree_headers=[line for line in parent_commit.split(b'\n\n',1)[0].split(b'\n') if line==b'tree' or line.startswith(b'tree ')]
              assert len(parent_tree_headers)==1 and re.fullmatch(b'tree [0-9a-f]{40}',parent_tree_headers[0]), 'CAPTURE_PARENT_OBJECT_TREE_FORMAT'
              expected_parent_tree=parent_tree_headers[0][5:].decode('ascii')
              observed_parent_tree=git('rev-parse',production_parent+'^{tree}').decode('ascii').strip()
              assert re.fullmatch('[0-9a-f]{40}',observed_parent_tree), 'CAPTURE_PARENT_TREE_FORMAT'
              assert observed_parent_tree==expected_parent_tree, 'CAPTURE_PARENT_TREE_MISMATCH'
              production_parent_tree=observed_parent_tree
              assert production_parent_tree=='db17d597bc28b80a0508f9c9fd97993bf2d9f353', 'WRONG_PRODUCTION_PARENT_TREE'
              report_generation=json.loads('{"schema":"statistical-levels.current-production-report-preservation.v1","production_commit":"d2f20862adb13946c0fc81567184a5c87e43a091","production_tree":"db17d597bc28b80a0508f9c9fd97993bf2d9f353","commits":[{"commit":"c60b17c6ddc5a08fcd402328f69e73f6e1e41b5f","raw_commit_sha256":"506d5bb8a19a88590c8ef75d5fd3bd8ccf156840f69af6eb44a07ca75f597f65","object_id_valid":true,"tree":"d5348c8ace77b433010ffc51ccab8674ccad81b9","parents":["4d7285851f524dd8faac5d47f159a163bdd3a56e"]},{"commit":"cccae985573110509483d6fa5a5dc12cd17f4003","raw_commit_sha256":"a6f5e8bd7492d450477fdc9a5b9a89b86b8329d9c6d0b8d9589cea468a5726d0","object_id_valid":true,"tree":"7b3b606d9fbd1581aeb2ec7c2bcb7c04801429a4","parents":["c60b17c6ddc5a08fcd402328f69e73f6e1e41b5f"]},{"commit":"94cfde442c974071886d8d8740207902ee68154a","raw_commit_sha256":"daef02c76a7df4b3b8733ffe710991a466b0a248dd5ea1231100d4266295566a","object_id_valid":true,"tree":"b9cae14402f369196ffd207c5d6a65d1d5301bfd","parents":["cccae985573110509483d6fa5a5dc12cd17f4003"]},{"commit":"d2f20862adb13946c0fc81567184a5c87e43a091","raw_commit_sha256":"0ea1496a743ab2fd1b7ef18d4736b750b8bfac92c0256aa8485af36309416f67","object_id_valid":true,"tree":"db17d597bc28b80a0508f9c9fd97993bf2d9f353","parents":["94cfde442c974071886d8d8740207902ee68154a"]}],"reports":{"components/reports/MarketReportContent.tsx":{"mode":"100644","oid":"50a782600aeec00808bbe7d8b56ce18d02dc4748","sha256":"fdcb3b0b59b59ba38a70d00ff3a48bbce49a5ae70ed073a8ba989d3585df6ff2"},"lib/reports/first-october-2026.test.mts":{"mode":"100644","oid":"c7ef66ede5d5c75ee6b6e10e83f4120350872247","sha256":"c550d0f1ce9e289972d0078c33830bc184ad420c9a19a9704db7a4018ac8d6a3"},"lib/reports/first-october-2026.ts":{"mode":"100644","oid":"cff57035d3f16e2096f1e05783deae95288b3831","sha256":"1ea880b3540b47a746073e02d76bcb210d3ee36843d77c0e11ef9837b4186211"},"lib/reports/first-september-2026.test.mts":{"mode":"100644","oid":"287134f5a6a664cf9a2bca748ad5b510cf852d79