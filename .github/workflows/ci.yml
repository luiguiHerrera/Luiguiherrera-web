                      "product QA preservation: rejects unknown_declaration",
                      "product QA preservation: rejects changed_export",
                      "product QA preservation: rejects malformed_ast",
                      "product QA preservation: rejects metadata_timestamp_call",
                      "product QA preservation: rejects metadata_recordTime_call",
                      "product QA preservation: rejects metadata_currentStatus_call",
                      "product QA preservation: rejects metadata_resolveProbePreview_call",
                      "governed metadata repair: missing_probe_qa_path",
                      "governed metadata repair: missing_product_qa_path",
                      "governed metadata repair: duplicate_probe_qa_path",
                      "governed metadata repair: duplicate_product_qa_path",
                      "metadata repair accounting: coverage_missing_probe_preservation",
                      "metadata repair accounting: coverage_missing_product_preservation",
                      "metadata repair accounting: coverage_duplicate_probe_preservation",
                      "metadata repair accounting: coverage_duplicate_product_preservation",
                  ]
                  for required in required_repair_cases:
                      assert len(re.findall(r'^ok \d+ - '+re.escape(required)+r'$',text,re.M))==1, 'METADATA_REPAIR_CASE_NOT_EXECUTED'
              if name=='product':
                  for failure in ['identity','storage','partial','collision','readback','manifest','provenance','validation']:
                      assert len(re.findall(r'^ok \d+ - real adapter failure injection: '+failure+r'$',text,re.M))==1, 'STORAGE_CASE_NOT_EXECUTED'
              summary[name]={'counts':counts,'explicit_local_only_or_nonapplicable_skips':skipped}
          assert len(list((root/'scripts/statistical-levels-release/tests').glob('*.test.mjs')))==34
          before=json.loads((out/'before.json').read_text())
          paths=sorted(subprocess.check_output(['git','ls-files','-z']).decode().rstrip('\0').split('\0'))
          assert paths==sorted(before)
          after={p:{'mode':format((root/p).stat().st_mode,'o'),'sha256':hashlib.sha256((root/p).read_bytes()).hexdigest()} for p in paths}
          assert after==before, 'GOVERNED_BYTES_CHANGED'
          subject=json.loads((out/'subject.json').read_text());assert subject['head_sha']==os.environ['CI_EVENT_SHA'], 'WRONG_SUBJECT_SHA'
          assert subject['head_sha']==os.environ['GITHUB_SHA'], 'WRONG_SUMMARY_SHA'
          assert subject['run_id']==os.environ['GITHUB_RUN_ID'] and subject['run_attempt']==os.environ['GITHUB_RUN_ATTEMPT'], 'CROSS_RUN_SUBJECT'
          assert subject['event']==os.environ['GITHUB_EVENT_NAME'] and subject['ref']==os.environ['GITHUB_REF'], 'WRONG_SUBJECT_EVENT'
          assert subject['integration_push']==(os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/vercel-deployment'), 'WRONG_INTEGRATION_CLASS'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==subject['head_sha']
          summary['subject']=subject
          summary['integration_qualification_complete']=subject['integration_push']
          summary['covered_obligations']=['C%02d'%i for i in range(1,14) if i!=11 or subject['integration_push']]
          summary['lineage_tests_executed']=True
          summary['governed_metadata_repair_parent_verified']=subject['lineage']['metadata_repair_parent_verified']
          summary['governed_registration_successor_parent_verified']=subject['lineage']['registration_successor_parent_verified']
          summary['governed_registration_content_verified']=subject['lineage']['registration_content_verified']
          summary['governed_two_parent_anchor_verified']=subject['lineage']['two_parent_anchor_verified']
          summary['candidate_content_sha256']=hashlib.sha256(json.dumps(after,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'qualification-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
