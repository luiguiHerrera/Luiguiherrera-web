              assert hashlib.sha256(json.dumps(report_generation,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()=='a36676c566e21bd879ff0d2c52e938bf6cad52f2bf48977ab636d1c29ae85ad0', 'REPORT_GENERATION_IDENTITY'
              for record in report_generation['commits']:
                  raw=git('cat-file','commit',record['commit'])
                  assert hashlib.sha256(raw).hexdigest()==record['raw_commit_sha256'], 'REPORT_COMMIT_IDENTITY'
                  assert hashlib.sha1(b'commit '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==record['commit'], 'REPORT_COMMIT_OBJECT'
                  headers=raw.decode().split('\n\n',1)[0].split('\n')
                  assert [x[7:]for x in headers if x.startswith('parent ')]==record['parents'], 'REPORT_PARENT_CHAIN'
                  assert [x[5:]for x in headers if x.startswith('tree ')]==[record['tree']], 'REPORT_COMMIT_TREE'
                  subprocess.run(['git','merge-base','--is-ancestor',record['commit'],head],check=True)
              for name,record in report_generation['reports'].items():
