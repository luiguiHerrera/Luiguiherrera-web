name: Update statistical levels

on:
  workflow_dispatch:
  schedule:
    # Tue-Sat at 08:30 UTC. GitHub schedules run on the default branch.
    - cron: "30 8 * * 2-6"

permissions:
  contents: write
  id-token: write

concurrency:
  group: statistical-levels-raw-authority-publication
  cancel-in-progress: false

env:
  STAT_LEVELS_AWS_REGION: ${{ vars.STAT_LEVELS_AWS_REGION }}
  STAT_LEVELS_RAW_BUCKET: ${{ vars.STAT_LEVELS_RAW_BUCKET }}
  STAT_LEVELS_RAW_ROLE_ARN: ${{ vars.STAT_LEVELS_RAW_ROLE_ARN }}
  STAT_LEVELS_RAW_AUTHORITY_READY: ${{ vars.STAT_LEVELS_RAW_AUTHORITY_READY }}

jobs:
  update-statistical-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail closed before all provider and publication operations
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "luiguiHerrera/Luiguiherrera-web"
          test "$GITHUB_REF" = "refs/heads/vercel-deployment"
          test "$STAT_LEVELS_RAW_AUTHORITY_READY" = "true"

      - name: Checkout the triggering deployment commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies before credentials exist
        run: npm ci

      - name: Assume dedicated storage role through GitHub OIDC
        # Official release v6.2.4; provenance in docs/statistical-levels-hosted-authority.md.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: ${{ vars.STAT_LEVELS_AWS_REGION }}
          role-to-assume: ${{ vars.STAT_LEVELS_RAW_ROLE_ARN }}
          audience: sts.amazonaws.com
          role-session-name: sl-raw-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          mask-aws-account-id: true
          retry-max-attempts: 2
          action-timeout-s: 120

      - name: Archive, verify, seal, reread and generate a validated candidate
        run: node scripts/statistical-levels-hosted.mjs prepare

      - name: Atomically commit validated snapshots and provenance, then push
        run: node scripts/statistical-levels-hosted.mjs publish

      - name: Bind the published commit to exact-version S3 readback
        run: node scripts/statistical-levels-ci/producer-receipt.mjs

      - name: Upload metadata-only publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sl-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/statistical-levels-ci-receipt/artifact/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
