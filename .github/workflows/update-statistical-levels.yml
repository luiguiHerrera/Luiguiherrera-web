name: Update statistical levels

on:
  workflow_dispatch:
  schedule:
    # Tue-Sat at 08:30 UTC, after US market close and after Stooq data is typically available.
    # Scheduled workflows only run from GitHub's default branch; local origin/HEAD points to
    # vercel-deployment, so keep this workflow on the default branch if that ever changes.
    - cron: "30 8 * * 2-6"

permissions:
  contents: write

jobs:
  update-statistical-levels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v5
        with:
          ref: vercel-deployment

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build statistical levels snapshot
        run: npm run build:stat-levels

      - name: Print snapshot manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("lib/statistical-levels/generated/manifest.json", "utf8"));
          console.log(JSON.stringify({
            generatedAt: manifest.generatedAt,
            snapshotGeneratedAt: manifest.snapshotGeneratedAt,
            sourceUrl: manifest.sourceUrl,
            statusCounts: manifest.statusCounts
          }, null, 2));
          NODE

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib/statistical-levels/generated-data.ts lib/statistical-levels/generated

          if git diff --cached --quiet; then
            echo "No statistical levels changes to commit."
            exit 0
          fi

          git commit -m "Update statistical levels snapshot"
          git push origin HEAD:vercel-deployment
