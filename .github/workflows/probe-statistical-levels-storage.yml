name: Probe Statistical Levels private storage

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: statistical-levels-synthetic-storage-probe
  cancel-in-progress: false

env:
  STAT_LEVELS_AWS_REGION: ${{ vars.STAT_LEVELS_AWS_REGION }}
  STAT_LEVELS_RAW_BUCKET: ${{ vars.STAT_LEVELS_RAW_BUCKET }}
  STAT_LEVELS_RAW_ROLE_ARN: ${{ vars.STAT_LEVELS_RAW_ROLE_ARN }}

jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the exact trusted branch and manual event
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "luiguiHerrera/Luiguiherrera-web"
          test "$GITHUB_REF" = "refs/heads/vercel-deployment"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Checkout the triggering deployment commit without repository write credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Assume dedicated storage role through GitHub OIDC
        # Official release v6.2.4; no stored AWS credential or profile inputs.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-region: ${{ vars.STAT_LEVELS_AWS_REGION }}
          role-to-assume: ${{ vars.STAT_LEVELS_RAW_ROLE_ARN }}
          audience: sts.amazonaws.com
          role-session-name: sl-probe-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          mask-aws-account-id: true
          retry-max-attempts: 2
          action-timeout-s: 120

      - name: Synthetic create, readback, seal and denial checks
        run: node scripts/statistical-levels-storage-probe.mjs
